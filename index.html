<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="photo/Frutiger aero icons/Aero Circle 04.png" />
    <link rel="stylesheet" href="os.css" />
    <title>DukeOS</title>
</head>
<body>
    <div id="topbar">
        <img src="photo/Frutiger aero icons/Aero Circle 04.png" class="frutiger-icon"/>
        <p class="toprow">Frutiger Aero</p>
        <p class="toprow">Finder</p>
        <p class="toprow">File</p>
        <p class="toprow">Edit</p>
        <p class="toprow">View</p>
        <p class="toprow">Go</p>
        <p class="toprow" id="timeElement"> Sat Jun 13 11:57 PM</p>
    </div>
    <main>
        <div id="welcome" class="window">
            <div class="main-header">
                <span class="Frutiger">Welcome to Frutiger Aero</span>
                <div class="window-controls" >
                    <img src="photo/Frutiger aero icons/X Button.png" id="btn-close">
                    <img src="photo/Frutiger aero icons/Maximize Button.png" id="btn-maximize">
                    <img src="photo/Frutiger aero icons/Minimize Button.png" id="btn-minimize">
                </div>
            </div>
            <div class="window-body">
            <p>Welcome to frutiger Aero OS! This is so frutiger. XD</p>
        </div>
        </div>
            <section>
                <div id="music-section" class="music-handle">
                    <div id="music-header">
                        <img src="photo/Frutiger aero icons/Music Note.png" class="music-note" />
                        <p>
                            Music
                        </p>
                    </div>
                </div>
                <div id="note-section" class="note-handle">
                    <div id="note-header">
                        <img src="photo/vista_sticky_notes.ico" class="note-pad" />
                    </div>
                </div>
            </section>
            <section>
                <audio controls autoplay src="audio/20260614_191301852.mp3" type="audio/mp3" >
                    <img src="photo/Frutiger aero icons/Aero Circle 07.png" />
                </audio>
            </section>
    </main>
    <script src="action.js"></script>
    <footer>
        <div id="doc">

        </div>
    </footer>
</body>
</html>
